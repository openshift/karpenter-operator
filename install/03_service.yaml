apiVersion: v1
kind: Service
metadata:
  name: karpenter-operator
  namespace: openshift-karpenter
  labels:
    k8s-app: karpenter-operator
  annotations:
    exclude.release.openshift.io/internal-openshift-hosted: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    release.openshift.io/feature-gate: KarpenterOperator
    service.beta.openshift.io/serving-cert-secret-name: karpenter-operator-cert
spec:
  selector:
    k8s-app: karpenter-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics

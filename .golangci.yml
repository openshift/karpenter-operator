version: "2"
run:
  modules-download-mode: vendor
  timeout: 5m
  build-tags:
    - envtest
linters:
  enable:
    - asciicheck
    - bidichk
    - copyloopvar
    - errorlint
    - gocyclo
    - gosec
    - importas
    - misspell
    - nilerr
    - revive
    - staticcheck
    - tparallel
    - unconvert
    - unparam
  disable:
    - prealloc
  settings:
    gocyclo:
      min-complexity: 11
    govet:
      disable:
        - fieldalignment
      enable-all: true
    importas:
      no-unaliased: true
      alias:
        - pkg: sigs.k8s.io/karpenter/pkg/apis
          alias: karpenterapis
        - pkg: sigs.k8s.io/karpenter/pkg/apis/v1
          alias: karpenterv1
        - pkg: github.com/aws/karpenter-provider-aws/pkg/apis
          alias: awskarpenterapis
        - pkg: github.com/aws/karpenter-provider-aws/pkg/apis/v1
          alias: awskarpenterv1
        - pkg: github.com/Azure/karpenter-provider-azure/pkg/apis
          alias: azurekarpenterapis
        - pkg: github.com/Azure/karpenter-provider-azure/pkg/apis/v1beta1
          alias: azurekarpenterv1beta1
        - pkg: github.com/openshift/hypershift/api/hypershift/v1beta1
          alias: hyperv1beta1
        - pkg: github.com/openshift/karpenter-operator/api/karpenter/v1
          alias: openshiftkarpenterv1
        - pkg: github.com/openshift/karpenter-operator/api/karpenter/v1alpha1
          alias: openshiftkarpenterv1alpha1
    misspell:
      locale: US
    revive:
      rules:
        - name: dot-imports
          disabled: true
    staticcheck:
      dot-import-whitelist:
        - github.com/onsi/ginkgo/v2
        - github.com/onsi/gomega
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: declaration of "(err|ctx)" shadows declaration at
      - linters:
          - unparam
        path: '_test\.go$'
      - linters:
          - gosec
        path: '_test\.go$'
        text: G101
formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
        - dot
        - prefix(github.com/openshift/karpenter-operator)
        - prefix(github.com/openshift)
        - prefix(github.com/aws)
        - prefix(k8s.io)
        - prefix(sigs.k8s.io)
        - default
      custom-order: true
  exclusions:
    generated: lax

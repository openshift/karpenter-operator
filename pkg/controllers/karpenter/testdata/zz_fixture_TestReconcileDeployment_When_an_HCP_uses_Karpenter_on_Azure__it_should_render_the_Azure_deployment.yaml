apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    release.openshift.io/version: 4.21.10
  labels:
    app: karpenter
    hypershift.openshift.io/managed-by: karpenter-operator
  name: karpenter
  namespace: clusters-autonode
  ownerReferences:
  - apiVersion: hypershift.openshift.io/v1beta1
    blockOwnerDeletion: true
    controller: true
    kind: HostedControlPlane
    name: autonode
    uid: ea7a5b7d-bd5b-4532-98e4-59a52b52cb74
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karpenter
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict-local-volumes: cloud-token,tmp
        openshift.io/required-scc: restricted-v2
        target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
      labels:
        app: karpenter
    spec:
      containers:
      - args:
        - --log-level=debug
        env:
        - name: SYSTEM_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CLUSTER_NAME
          value: autonode
        - name: CLUSTER_ENDPOINT
          value: https://api.autonode.hypershift.local:6443
        - name: DISABLE_WEBHOOK
          value: "true"
        - name: HEALTH_PROBE_PORT
          value: "8081"
        - name: LOCATION
          value: eastus
        - name: AZURE_CLIENT_ID
          value: 11111111-1111-1111-1111-111111111111
        - name: AZURE_TENANT_ID
          value: 22222222-2222-2222-2222-222222222222
        - name: AZURE_SUBSCRIPTION_ID
          value: 00000000-0000-0000-0000-000000000000
        - name: AZURE_FEDERATED_TOKEN_FILE
          value: /var/run/secrets/openshift/serviceaccount/token
        - name: VNET_SUBNET_ID
          value: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/autonode/providers/Microsoft.Network/virtualNetworks/autonode-vnet/subnets/default
        - name: AZURE_NODE_RESOURCE_GROUP
          value: autonode-nodes
        - name: PROVISION_MODE
          value: openshift
        - name: KUBECONFIG
          value: /mnt/kubeconfig/target-kubeconfig
        - name: DISABLE_LEADER_ELECTION
          value: "true"
        image: quay.io/openshift/origin-azure-karpenter-provider-azure:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 30
          timeoutSeconds: 30
        name: karpenter
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          timeoutSeconds: 30
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /mnt/kubeconfig
          name: target-kubeconfig
          readOnly: true
        - mountPath: /var/run/secrets/openshift/serviceaccount
          name: cloud-token
        - mountPath: /tmp
          name: tmp
      initContainers:
      - args:
        - --service-account-namespace=kube-system
        - --service-account-name=karpenter
        - --token-file=/var/run/secrets/openshift/serviceaccount/token
        - --kubeconfig=/mnt/kubeconfig/target-kubeconfig
        command:
        - /usr/bin/control-plane-operator
        - token-minter
        image: quay.io/openshift/origin-hypershift:latest
        imagePullPolicy: IfNotPresent
        name: token-minter
        resources:
          requests:
            cpu: 10m
            memory: 30Mi
        restartPolicy: Always
        startupProbe:
          exec:
            command:
            - test
            - -f
            - /var/run/secrets/openshift/serviceaccount/token
          failureThreshold: 30
          periodSeconds: 1
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /mnt/kubeconfig
          name: target-kubeconfig
        - mountPath: /var/run/secrets/openshift/serviceaccount
          name: cloud-token
      priorityClassName: hypershift-control-plane
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: karpenter
      terminationGracePeriodSeconds: 10
      volumes:
      - name: target-kubeconfig
        secret:
          defaultMode: 416
          items:
          - key: value
            path: target-kubeconfig
          secretName: autonode-9q7m2-kubeconfig
      - emptyDir: {}
        name: cloud-token
      - emptyDir: {}
        name: tmp
